# HealthMitra 2.0 — Production Docker Compose
# Usage:
#   1. Copy .env.production.example -> .env.production and fill in real secrets
#   2. Place SSL certs at ./ssl/fullchain.pem and ./ssl/privkey.pem
#      OR use Cloudflare/Railway (which handle TLS for you — skip SSL volume)
#   3. docker compose -f docker-compose.prod.yml up -d --build

services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env.production
    environment:
      MONGODB_URI: mongodb://healthmitra_app:${MONGO_APP_PASSWORD}@mongo:27017/healthmitra?authSource=admin
      ENVIRONMENT: production
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      args:
        # Leave empty for same-domain nginx proxy, or set to full backend URL
        # e.g.: https://api.healthmitra.yourdomain.com
        REACT_APP_API_URL: ${REACT_APP_API_URL:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - internal


  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - internal

  mongo:
    image: mongo:8.3
    environment:
      MONGO_INITDB_ROOT_USERNAME: healthmitra_admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ADMIN_PASSWORD}
    command: ["mongod", "--auth", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh -u healthmitra_admin -p ${MONGO_ADMIN_PASSWORD} --authenticationDatabase admin --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  mongo_data:
