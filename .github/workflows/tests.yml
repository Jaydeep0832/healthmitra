name: Tests

on:
  push:
    branches: [ main, develop, feature/v2-production ]
  pull_request:
    branches: [ main, develop, feature/v2-production ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.3
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: ci-only-test-secret-key-do-not-use-in-production
      ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      MONGODB_URI: mongodb://localhost:27017
      GROQ_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Start API
        working-directory: backend
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/healthmitra-api.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail http://127.0.0.1:8000/api/health; then exit 0; fi
            sleep 2
          done
          cat /tmp/healthmitra-api.log
          exit 1
      - name: Run backend integration tests
        working-directory: backend
        run: pytest tests/ -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '18.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps
      - name: Lint check
        working-directory: frontend
        run: npx react-scripts build 2>&1 | head -5 || true
      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --watchAll=false --passWithNoTests
        env:
          CI: true
          REACT_APP_API_URL: ''
      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          REACT_APP_API_URL: ''
