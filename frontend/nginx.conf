resolver 1.1.1.1 8.8.8.8 127.0.0.11 valid=30s ipv6=off;

server {
    listen 80;
    server_name localhost;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # Frontend SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API proxy
    location /api {
        proxy_pass https://healthmitra-backend-mu58.onrender.com;
        proxy_ssl_server_name on;
        proxy_set_header Host healthmitra-backend-mu58.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10M;

        # Extended timeouts for LLM-backed endpoints
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Health check
    location /health {
        proxy_pass https://healthmitra-backend-mu58.onrender.com/api/health;
        proxy_ssl_server_name on;
    }

    # Docs — only available in development (behind ENVIRONMENT toggle)
    location /docs {
        set $upstream http://backend:8000;
        proxy_pass $upstream;
    }

    location /openapi.json {
        set $upstream http://backend:8000;
        proxy_pass $upstream;
    }
}
